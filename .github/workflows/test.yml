name: Daily Market Data Collector

on:
  schedule:
    # 한국 15:40 = UTC 06:40 / 한국 20:15 = UTC 11:15 (월~금)
    - cron: '40 6 * * 1-5'
    - cron: '15 11 * * 1-5'
  workflow_dispatch:

jobs:
  collect-data:
    # 우분투 최신 버전 명시 (경고창 제거)
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Node.js 경고 제거를 위해 v4로 업그레이드

      - name: Set up Python
        uses: actions/setup-python@v5 # Node.js 경고 제거를 위해 v5로 업그레이드
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # 에러 방지를 위해 필요한 모든 라이브러리를 직접 명확하게 설치하도록 수정
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests gspread google-api-python-client finance-datareader beautifulsoup4

      - name: Run Collector and Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_URL: ${{ secrets.GSHEET_URL }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          python main.py
          python screener.py

      - name: Commit and Push CSV Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data_archive.csv
          git commit -m "Auto-update market data archive" || echo "No changes to commit"
          git push